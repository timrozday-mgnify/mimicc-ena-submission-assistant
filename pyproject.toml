[project]
name = "mimicc-ena-submission-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web app (single-user, local-only: no database, auth, or cache)
    "Django>=5,<6",
    "gunicorn",

    # ena-submission-toolkit and standalone linkml-lib dependencies
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML",
    "lxml",
    "pendulum",
    "typer",
    "linkml",

    # Pinned sibling packages (replaces scripts/vendor.sh's cp -R from ../<repo>).
    # Use the URL-migration commit until ena-submission-toolkit cuts its next release.
    "linkml-lib @ git+https://github.com/EBI-Metagenomics/linkml-lib.git@v0.1.0",
    "ena-submission-toolkit @ git+https://github.com/EBI-Metagenomics/ena-submission-toolkit.git@f23f30d69d109b8223e44ae3c7f8fd99c83df474",
]

# Test-only. `uv sync` installs these by default and prunes anything it does
# not know about, so they have to be declared here or a sync silently removes
# pytest and Playwright from .venv.
[dependency-groups]
dev = [
    "mypy>=1.14",
    "playwright",
    "pre-commit>=4",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The app runs via PYTHONPATH (server/), not as an importable distribution —
# this table only exists so `pip install .` has something (empty) to build.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"

# None of these ship a py.typed marker; the siblings are pinned to git tags
# that predate their markers.
[[tool.mypy.overrides]]
module = [
    "django.*",
    "ena_api.*",
    "ena_submission_toolkit.*",
    "linkml.*",
    "linkml_lib.*",
    "linkml_runtime.*",
    "pendulum.*",
]
ignore_missing_imports = true
