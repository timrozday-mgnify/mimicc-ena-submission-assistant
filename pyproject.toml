[project]
name = "mimicc-ena-submission-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web app (single-user, local-only: no database, auth, or cache)
    "Django>=5,<6",
    "gunicorn",

    # ena-api-client, ena-submission-toolkit, and standalone linkml-lib dependencies
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML",
    "lxml",
    "pendulum",
    "typer",
    "linkml",

    # Pinned sibling packages (replaces scripts/vendor.sh's cp -R from ../<repo>).
    # Bump the tag here when a sibling repo cuts a new release.
    # ena-submission-toolkit is pinned to a commit rather than a tag: the
    # Browser-API field enrichment `ena_service.list_records(full_fields=...)`
    # relies on is on main and has no release of its own yet. Move it back to a
    # tag at the next one.
    "ena-api-client @ git+https://github.com/timrozday-mgnify/ena-api-client.git@v0.1.2",
    "linkml-lib @ git+https://github.com/timrozday-mgnify/linkml-lib.git@v0.1.0",
    "ena-submission-toolkit @ git+https://github.com/timrozday-mgnify/ena-submission-toolkit.git@f928775f527c9295d1dd731eaca843b8fad96d65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The app runs via PYTHONPATH (server/), not as an importable distribution —
# this table only exists so `pip install .` has something (empty) to build.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
